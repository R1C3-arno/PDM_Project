spring:
  application:
    name: loan-management-system

  datasource:
    url: jdbc:mysql://localhost:3306/loan_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: app
    password: inu
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  security:
    # Security configuration is handled in SecurityConfig.java
    # This section can be used for additional security properties

# JWT Configuration
jwt:
  secret: cGRtLWRldi1qd3Qtc2VjcmV0LWtleS1mb3ItdGVzdGluZy1vbmx5LWNoYW5nZS1pbi1wcm9kdWN0aW9uLW1pbi0yNTYtYml0cw==
  expiration: 900000  # 15 minutes in milliseconds
  refresh-expiration: 604800000  # 7 days in milliseconds
  cookie-name: ${JWT_COOKIE_NAME:token}
  cookie-max-age: ${JWT_COOKIE_MAX_AGE:900}  # 15 minutes in seconds

# Server Configuration
server:
  port: 4001
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

# Logging Configuration
logging:
  level:
    root: INFO
    com.loanweb: ${LOG_LEVEL:DEBUG}
    org.springframework.security: ${SECURITY_LOG_LEVEL:DEBUG}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:DEBUG}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Application Configuration
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:4000,http://localhost:5173
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    max-age: ${CORS_MAX_AGE:3600}
