name: Backend CI

on:
  push:
    branches:
      - main
      - deployment
    paths:
      - 'pdm-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
      - deployment
    paths:
      - 'pdm-backend/**'
      - '.github/workflows/backend-ci.yml'

# Ensures only one workflow runs at a time per PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Test & Build Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./pdm-backend

    strategy:
      matrix:
        java-version: [17]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('pdm-backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Verify Maven installation
        run: mvn --version

      - name: Clean and compile
        run: mvn clean compile
        continue-on-error: false

      - name: Run tests
        run: mvn test
        continue-on-error: false
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Generate JaCoCo coverage report
        run: mvn jacoco:report
        continue-on-error: true

      - name: Check code coverage
        run: mvn jacoco:check
        continue-on-error: true

      # Upload coverage reports (optional - uncomment when needed)
      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@v4
      #   with:
      #     files: ./pdm-backend/target/site/jacoco/jacoco.xml
      #     flags: backend
      #     name: backend-coverage

      - name: Build package
        run: mvn package -DskipTests
        env:
          SPRING_PROFILES_ACTIVE: production

      - name: Verify JAR file
        run: |
          if [ ! -f target/*.jar ]; then
            echo "❌ Build failed - JAR file not found"
            exit 1
          fi
          echo "✅ Build successful"
          ls -lah target/*.jar

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar-${{ github.sha }}
          path: pdm-backend/target/*.jar
          retention-days: 7
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-${{ github.sha }}
          path: |
            pdm-backend/target/surefire-reports/
            pdm-backend/target/site/jacoco/
          retention-days: 7

      - name: Build summary
        if: always()
        run: |
          echo "## Backend Build Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Java Version:** ${{ matrix.java-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          if [ -f target/site/jacoco/index.html ]; then
            echo "- **Coverage Report:** Generated" >> $GITHUB_STEP_SUMMARY
          fi
