name: Backend CI

on:
  push:
    branches: [main, deployment]
    paths:
      - 'pdm-backend/**'
  pull_request:
    branches: [main, deployment]
    paths:
      - 'pdm-backend/**'

jobs:
  build:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./pdm-backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean compile -DskipTests

      - name: Run tests
        run: mvn test
        continue-on-error: true

      - name: Package
        run: mvn package -DskipTests
