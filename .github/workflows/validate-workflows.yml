name: Validate Workflows

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches:
      - main
      - deployment
    paths:
      - '.github/workflows/**'

jobs:
  validate-yaml:
    name: Validate YAML Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Validate workflow files
        run: |
          echo "Validating GitHub Actions workflow files..."
          yamllint -c .github/yamllint-config.yml .github/workflows/ || true

      - name: Check workflow syntax
        run: |
          for file in .github/workflows/*.yml; do
            echo "Checking $file..."
            # Basic syntax validation
            if ! python3 -c "import yaml; yaml.safe_load(open('$file'))" 2>/dev/null; then
              echo "::error::Invalid YAML syntax in $file"
              exit 1
            fi
          done
          echo "All workflow files have valid YAML syntax"

      - name: Workflow validation summary
        run: |
          echo "## Workflow Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All GitHub Actions workflow files validated successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Validated Files:" >> $GITHUB_STEP_SUMMARY
          for file in .github/workflows/*.yml; do
            echo "- $file" >> $GITHUB_STEP_SUMMARY
          done
