<div id="transactionPopup" class="hidden fixed inset-0 bg-black bg-opacity-50 z-[150]">
    <div class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full">

            <div class="bg-blue-500 text-white px-6 py-4 rounded-t-lg flex justify-between items-center">
                <h3 class="text-xl font-bold">Transaction Details</h3>
                <button onclick="closeTransactionPopup()" class="text-2xl hover:text-gray-200">&times;</button>
            </div>

            <div class="p-6">
                <div class="text-center mb-6">
                    <div class="w-20 h-20 mx-auto rounded-full bg-blue-500 text-white flex items-center justify-center text-3xl">
                        💳
                    </div>
                    <h4 id="txPopupId" class="text-xl font-bold mt-3"></h4>
                    <p id="txPopupReference" class="text-gray-500 text-sm"></p>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <p class="text-gray-500 text-sm mb-1">User ID</p>
                        <p id="txPopupUserId" class="font-medium"></p>
                    </div>
                    <div>
                        <p class="text-gray-500 text-sm mb-1">Loan ID</p>
                        <p id="txPopupLoanId" class="font-medium"></p>
                    </div>
                    <div>
                        <p class="text-gray-500 text-sm mb-1">Type</p>
                        <span id="txPopupType" class="px-3 py-1 text-xs rounded-full"></span>
                    </div>
                    <div>
                        <p class="text-gray-500 text-sm mb-1">Status</p>
                        <span id="txPopupStatus" class="px-3 py-1 text-xs rounded-full"></span>
                    </div>
                    <div>
                        <p class="text-gray-500 text-sm mb-1">Amount</p>
                        <p id="txPopupAmount" class="font-medium text-lg text-green-600"></p>
                    </div>
                    <div>
                        <p class="text-gray-500 text-sm mb-1">Date</p>
                        <p id="txPopupDate" class="font-medium"></p>
                    </div>
                    <div class="col-span-2">
                        <p class="text-gray-500 text-sm mb-1">Description</p>
                        <p id="txPopupDescription" class="font-medium"></p>
                    </div>
                </div>
            </div>

            <div class="bg-gray-50 px-6 py-4 rounded-b-lg flex justify-end gap-3">
                <button onclick="closeTransactionPopup()" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400 transition">
                    Close
                </button>
                <button onclick="openPrintFromView()" class="px-4 py-2 bg-purple-500 text-white rounded hover:bg-purple-600 transition">
                    🖨️ Print Receipt
                </button>
            </div>
        </div>
    </div>
</div>
