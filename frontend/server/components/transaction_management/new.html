<div id="newTransactionPopup" class="hidden fixed inset-0 bg-black bg-opacity-50 z-[150]">
    <div class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full">

            <div class="bg-green-500 text-white px-6 py-4 rounded-t-lg flex justify-between items-center">
                <h3 class="text-xl font-bold">Create New Transaction</h3>
                <button onclick="closeNewTransactionPopup()" class="text-2xl hover:text-gray-200">&times;</button>
            </div>

            <div class="p-6">
                <div class="text-center mb-6">
                    <div class="w-20 h-20 mx-auto rounded-full bg-green-500 text-white flex items-center justify-center text-3xl">
                        💳
                    </div>
                    <p class="text-gray-600 text-sm mt-3">Fill in the details to create a new transaction</p>
                </div>

                <form id="newTransactionForm" class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-700 text-sm font-medium mb-2">User ID <span class="text-red-500">*</span></label>
                        <input type="number" id="newTxUserId"
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500" required>
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm font-medium mb-2">Loan ID <span class="text-red-500">*</span></label>
                        <input type="number" id="newTxLoanId"
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500" required>
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm font-medium mb-2">Type <span class="text-red-500">*</span></label>
                        <select id="newTxType" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500" required>
                            <option value="">Select type...</option>
                            <option value="Payment">Payment</option>
                            <option value="Disbursement">Disbursement</option>
                            <option value="Refund">Refund</option>
                            <option value="Fee">Fee</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm font-medium mb-2">Amount ($) <span class="text-red-500">*</span></label>
                        <input type="number" id="newTxAmount" step="0.01"
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500" required>
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm font-medium mb-2">Status <span class="text-red-500">*</span></label>
                        <select id="newTxStatus" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500" required>
                            <option value="">Select status...</option>
                            <option value="Completed">Completed</option>
                            <option value="Pending" selected>Pending</option>
                            <option value="Failed">Failed</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm font-medium mb-2">Reference Number</label>
                        <input type="text" id="newTxReference"
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500">
                    </div>

                    <div class="col-span-2">
                        <label class="block text-gray-700 text-sm font-medium mb-2">Description</label>
                        <textarea id="newTxDescription" rows="3"
                                  class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500"></textarea>
                    </div>
                </form>
            </div>

            <div class="bg-gray-50 px-6 py-4 rounded-b-lg flex justify-end gap-3">
                <button onclick="closeNewTransactionPopup()" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400 transition">
                    Cancel
                </button>
                <button onclick="createNewTransaction()" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600 transition">
                    Create Transaction
                </button>
            </div>

        </div>
    </div>
</div>
