<!-- Edit User Popup -->
<div id="editUserPopup" class="hidden fixed inset-0 bg-black bg-opacity-50 z-[150]">
    <div class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full">

            <!-- Header -->
            <div class="bg-yellow-500 text-white px-6 py-4 rounded-t-lg flex justify-between items-center">
                <h3 class="text-xl font-bold">✏️ Edit User</h3>
                <button onclick="closeEditPopup()" class="text-2xl hover:text-gray-200">&times;</button>
            </div>

            <!-- Body - Form -->
            <div class="p-6">
                <form id="editUserForm">

                    <!-- User ID (Read only) -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">User ID</label>
                        <input type="text" id="editUserId" readonly
                               class="w-full px-4 py-2 border rounded-lg bg-gray-100 text-gray-600">
                    </div>

                    <!-- Full Name -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Full Name *</label>
                        <input type="text" id="editUserName" required
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-yellow-500">
                    </div>

                    <!-- Email -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email *</label>
                        <input type="email" id="editUserEmail" required
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-yellow-500">
                    </div>

                    <!-- Phone -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Phone *</label>
                        <input type="tel" id="editUserPhone" required
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-yellow-500">
                    </div>

                    <!-- Role -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Role *</label>
                        <select id="editUserRole" required
                                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-yellow-500">
                            <option value="">-- Select Role --</option>
                            <option value="Admin">Admin</option>
                            <option value="User">User</option>
                            <option value="Manager">Manager</option>
                        </select>
                    </div>

                    <!-- Status -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Status *</label>
                        <select id="editUserStatus" required
                                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-yellow-500">
                            <option value="">-- Select Status --</option>
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                            <option value="Suspended">Suspended</option>
                        </select>
                    </div>

                    <!-- Created Date (Read only) -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Created Date</label>
                        <input type="text" id="editUserCreated" readonly
                               class="w-full px-4 py-2 border rounded-lg bg-gray-100 text-gray-600">
                    </div>

                </form>
            </div>

            <!-- Footer -->
            <div class="bg-gray-50 px-6 py-4 rounded-b-lg flex justify-end gap-3">
                <button onclick="closeEditPopup()"
                        class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">
                    Cancel
                </button>
                <button onclick="saveUserEdit()"
                        class="px-4 py-2 bg-yellow-500 text-white rounded hover:bg-yellow-600">
                    Save Changes
                </button>
            </div>

        </div>
    </div>
</div>
