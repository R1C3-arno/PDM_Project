<div id="userPopup" class="hidden fixed inset-0 bg-black bg-opacity-50 z-[150]">
    <div class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full">

            <!-- Header -->
            <div class="bg-blue-500 text-white px-6 py-4 rounded-t-lg flex justify-between items-center">
                <h3 class="text-xl font-bold">User Details</h3>
                <button onclick="closeUserPopup()" class="text-2xl hover:text-gray-200">&times;</button>
            </div>

            <!-- Body -->
            <div class="p-6">
                <!-- Avatar -->
                <div class="text-center mb-6">
                    <div id="popupAvatar" class="w-20 h-20 mx-auto rounded-full bg-blue-500 text-white flex items-center justify-center text-2xl font-bold">
                        JD
                    </div>
                    <h4 id="popupName" class="text-xl font-bold mt-3">John Doe</h4>
                    <p id="popupId" class="text-gray-500 text-sm">#U001</p>
                </div>

                <!-- Info Grid -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <p class="text-gray-500 text-sm mb-1">Email</p>
                        <p id="popupEmail" class="font-medium">john.doe@example.com</p>
                    </div>
                    <div>
                        <p class="text-gray-500 text-sm mb-1">Phone</p>
                        <p id="popupPhone" class="font-medium">+84 912 345 678</p>
                    </div>
                    <div>
                        <p class="text-gray-500 text-sm mb-1">Role</p>
                        <span id="popupRole" class="px-3 py-1 text-xs rounded-full bg-purple-100 text-purple-600">Admin</span>
                    </div>
                    <div>
                        <p class="text-gray-500 text-sm mb-1">Status</p>
                        <span id="popupStatus" class="px-3 py-1 text-xs rounded-full bg-green-100 text-green-600">Active</span>
                    </div>
                    <div>
                        <p class="text-gray-500 text-sm mb-1">Created Date</p>
                        <p id="popupCreated" class="font-medium">Jan 15, 2025</p>
                    </div>
                    <div>
                        <p class="text-gray-500 text-sm mb-1">Last Login</p>
                        <p id="popupLastLogin" class="font-medium">Nov 16, 2025</p>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="bg-gray-50 px-6 py-4 rounded-b-lg flex justify-end gap-3">
                <button onclick="closeUserPopup()" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">
                    Close
                </button>
                <button class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
                    Edit
                </button>
            </div>
        </div>
    </div>
</div>
