<!-- Edit Wallet Popup -->
<div id="editWalletPopup" class="hidden fixed inset-0 bg-black bg-opacity-50 z-[150]">
    <div class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full">

            <!-- Header -->
            <div class="bg-yellow-500 text-white px-6 py-4 rounded-t-lg flex justify-between items-center">
                <h3 class="text-xl font-bold">✏️ Edit Wallet</h3>
                <button onclick="closeEditWalletPopup()" class="text-2xl hover:text-gray-200">&times;</button>
            </div>

            <!-- Body - Form -->
            <div class="p-6">
                <form id="editWalletForm">

                    <!-- Wallet ID (Read only) -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Wallet ID</label>
                        <input type="text" id="editWalletId" readonly
                               class="w-full px-4 py-2 border rounded-lg bg-gray-100 text-gray-600">
                    </div>

                    <!-- User ID (Read only) -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">User ID</label>
                        <input type="text" id="editWalletUserId" readonly
                               class="w-full px-4 py-2 border rounded-lg bg-gray-100 text-gray-600">
                    </div>

                    <!-- Balance -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Balance *</label>
                        <input type="number" id="editWalletBalance" step="0.01" required
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-yellow-500">
                    </div>

                    <!-- Available Credit -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Available Credit *</label>
                        <input type="number" id="editWalletCredit" step="0.01" required
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-yellow-500">
                    </div>

                    <!-- Total Borrowed -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Total Borrowed *</label>
                        <input type="number" id="editWalletBorrowed" step="0.01" required
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-yellow-500">
                    </div>

                    <!-- Total Repaid -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Total Repaid *</label>
                        <input type="number" id="editWalletRepaid" step="0.01" required
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-yellow-500">
                    </div>

                </form>
            </div>

            <!-- Footer -->
            <div class="bg-gray-50 px-6 py-4 rounded-b-lg flex justify-end gap-3">
                <button onclick="closeEditWalletPopup()"
                        class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">
                    Cancel
                </button>
                <button onclick="saveWalletEdit()"
                        class="px-4 py-2 bg-yellow-500 text-white rounded hover:bg-yellow-600">
                    Save Changes
                </button>
            </div>

        </div>
    </div>
</div>
