<!-- View Wallet Popup -->
<div id="walletPopup" class="hidden fixed inset-0 bg-black bg-opacity-50 z-[150]">
    <div class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full">

            <!-- Header -->
            <div class="bg-blue-500 text-white px-6 py-4 rounded-t-lg flex justify-between items-center">
                <h3 class="text-xl font-bold">Wallet Details</h3>
                <button onclick="closeWalletPopup()" class="text-2xl hover:text-gray-200">&times;</button>
            </div>

            <!-- Body -->
            <div class="p-6">
                <!-- Icon Wallet -->
                <div class="text-center mb-6">
                    <div class="w-20 h-20 mx-auto rounded-full bg-blue-500 text-white flex items-center justify-center text-3xl">
                        💰
                    </div>
                    <h4 id="walletPopupId" class="text-xl font-bold mt-3">#W001</h4>
                    <p id="walletPopupUserId" class="text-gray-500 text-sm">User: U12345</p>
                </div>

                <!-- Info Grid -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <p class="text-gray-500 text-sm mb-1">Balance</p>
                        <p id="walletPopupBalance" class="font-medium text-lg text-green-600">$5,000</p>
                    </div>
                    <div>
                        <p class="text-gray-500 text-sm mb-1">Available Credit</p>
                        <p id="walletPopupCredit" class="font-medium">$10,000</p>
                    </div>
                    <div>
                        <p class="text-gray-500 text-sm mb-1">Total Borrowed</p>
                        <p id="walletPopupBorrowed" class="font-medium text-red-600">$50,000</p>
                    </div>
                    <div>
                        <p class="text-gray-500 text-sm mb-1">Total Repaid</p>
                        <p id="walletPopupRepaid" class="font-medium text-blue-600">$30,000</p>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="bg-gray-50 px-6 py-4 rounded-b-lg flex justify-end gap-3">
                <button onclick="closeWalletPopup()" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">
                    Close
                </button>
                <button class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
                    Edit
                </button>
            </div>
        </div>
    </div>
</div>
