<!-- Wallet Management Section -->
<main>
    <!-- Header với Search & Actions -->
    <div class="bg-white rounded-lg shadow p-6 mb-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-bold text-gray-800">Wallet Management</h2>
            <button class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600">
                + New Wallet
            </button>
        </div>

        <div class="flex gap-4">
            <input type="text" placeholder="🔍 Search by User ID or Wallet ID..."
                   class="flex-1 px-4 py-2 border rounded-lg">
            <select class="px-4 py-2 border rounded-lg">
                <option>All Wallets</option>
                <option>Active</option>
                <option>Suspended</option>
            </select>
        </div>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="w-full">
            <thead class="bg-gray-50 border-b">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Wallet ID</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">User ID</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Balance</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Available Credit</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Total Borrowed</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Total Repaid</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Actions</th>
            </tr>
            </thead>
            <tbody class="divide-y">
            <tr class="hover:bg-gray-50">
                <td class="px-6 py-4 text-sm font-semibold">#W001</td>
                <td class="px-6 py-4 text-sm">U12345</td>
                <td class="px-6 py-4 text-sm font-semibold text-green-600">$5,000</td>
                <td class="px-6 py-4 text-sm">$10,000</td>
                <td class="px-6 py-4 text-sm text-red-600">$50,000</td>
                <td class="px-6 py-4 text-sm text-blue-600">$30,000</td>
                <td class="px-6 py-4">
                    <div class="flex gap-2">
                        <button onclick="openWalletPopup('W001')" class="text-blue-600 hover:text-blue-800" title="View">👁️</button>
                        <button class="text-yellow-600 hover:text-yellow-800" title="Edit">✏️</button>
                        <button class="text-red-600 hover:text-red-800" title="Delete">🗑️</button>
                    </div>
                </td>
            </tr>
            <tr class="hover:bg-gray-50">
                <td class="px-6 py-4 text-sm font-semibold">#W002</td>
                <td class="px-6 py-4 text-sm">U67890</td>
                <td class="px-6 py-4 text-sm font-semibold text-green-600">$2,500</td>
                <td class="px-6 py-4 text-sm">$5,000</td>
                <td class="px-6 py-4 text-sm text-red-600">$20,000</td>
                <td class="px-6 py-4 text-sm text-blue-600">$15,000</td>
                <td class="px-6 py-4">
                    <div class="flex gap-2">
                        <button onclick="openWalletPopup('W002')" class="text-blue-600 hover:text-blue-800">👁️</button>
                        <button class="text-yellow-600 hover:text-yellow-800">✏️</button>
                        <button class="text-red-600 hover:text-red-800">🗑️</button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
