<main>
    <div class="bg-white rounded-lg shadow p-6 mb-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-bold text-gray-800">Notifications</h2>
            <button onclick="openNewNotificationPopup()" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 flex items-center gap-2">
                <i class='bx bx-plus'></i> Send Notification
            </button>
        </div>

        <div class="flex gap-4">
            <input type="text" id="searchInput" placeholder="🔍 Search by User ID or Notification ID..."
                   class="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
            <select id="filterType" class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                <option value="">All Types</option>
                <option value="Info">Info</option>
                <option value="Warning">Warning</option>
                <option value="Success">Success</option>
                <option value="Error">Error</option>
            </select>
            <select id="filterStatus" class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                <option value="">All Status</option>
                <option value="true">Read</option>
                <option value="false">Unread</option>
            </select>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="w-full">
            <thead class="bg-gray-50 border-b">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">ID</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">User ID</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Title</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Message</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Type</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Status</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Created</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Actions</th>
            </tr>
            </thead>
            <tbody class="divide-y"></tbody>
        </table>
    </div>
</main>
