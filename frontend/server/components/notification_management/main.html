<!-- Notification Management  -->
<main>
    <!-- Header với Search & Actions -->
    <div class="bg-white rounded-lg shadow p-6 mb-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-bold text-gray-800">Notifications</h2>
            <button onclick="openNewNotificationPopup()" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600">
                + Send Notification
            </button>
        </div>

        <div class="flex gap-4">
            <input type="text" placeholder="🔍 Search by User ID or Notification ID..."
                   class="flex-1 px-4 py-2 border rounded-lg">
            <select class="px-4 py-2 border rounded-lg">
                <option>All Types</option>
                <option>Info</option>
                <option>Warning</option>
                <option>Success</option>
                <option>Error</option>
            </select>
            <select class="px-4 py-2 border rounded-lg">
                <option>All Status</option>
                <option>Read</option>
                <option>Unread</option>
            </select>
        </div>
    </div>

    <!-- Send Notification Form (Hidden by default) -->
    <div class="bg-white rounded-lg shadow p-6 mb-6 hidden" id="send-notification-form">
        <h3 class="text-xl font-bold text-gray-800 mb-4">Send New Notification</h3>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">User ID</label>
                <input type="text" placeholder="Enter User ID (e.g., U12345)"
                       class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Title</label>
                <input type="text" placeholder="Notification title"
                       class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Message</label>
                <textarea placeholder="Enter notification message..." rows="4"
                          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500"></textarea>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Type</label>
                <select class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500">
                    <option>Info</option>
                    <option>Warning</option>
                    <option>Success</option>
                    <option>Error</option>
                </select>
            </div>

            <div class="flex gap-3">
                <button class="bg-green-500 text-white px-6 py-2 rounded-lg hover:bg-green-600">
                    Send Notification
                </button>
                <button class="bg-gray-300 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-400"
                        onclick="document.getElementById('send-notification-form').classList.add('hidden')">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="w-full">
            <thead class="bg-gray-50 border-b">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">ID</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">User ID</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Title</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Message</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Type</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Status</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Created</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Actions</th>
            </tr>
            </thead>
            <tbody class="divide-y">
            <tr class="hover:bg-gray-50">
                <td class="px-6 py-4 text-sm font-semibold">#N001</td>
                <td class="px-6 py-4 text-sm">U12345</td>
                <td class="px-6 py-4 text-sm font-semibold">Loan Approved</td>
                <td class="px-6 py-4 text-sm">Your loan application has been approved</td>
                <td class="px-6 py-4">
                    <span class="px-3 py-1 text-xs rounded-full bg-green-100 text-green-600">Success</span>
                </td>
                <td class="px-6 py-4">
                    <span class="px-3 py-1 text-xs rounded-full bg-blue-100 text-blue-600">Read</span>
                </td>
                <td class="px-6 py-4 text-sm">Jan 15, 2025</td>
                <td class="px-6 py-4">
                    <div class="flex gap-2">
                        <button onclick="openNotificationPopup('N001')" class="text-blue-600 hover:text-blue-800" title="View">👁️</button>
                        <button class="text-red-600 hover:text-red-800" title="Delete">🗑️</button>
                    </div>
                </td>
            </tr>
            <tr class="hover:bg-gray-50 bg-yellow-50">
                <td class="px-6 py-4 text-sm font-semibold">#N002</td>
                <td class="px-6 py-4 text-sm">U67890</td>
                <td class="px-6 py-4 text-sm font-semibold">Payment Due</td>
                <td class="px-6 py-4 text-sm">Your payment is due in 3 days</td>
                <td class="px-6 py-4">
                    <span class="px-3 py-1 text-xs rounded-full bg-yellow-100 text-yellow-600">Warning</span>
                </td>
                <td class="px-6 py-4">
                    <span class="px-3 py-1 text-xs rounded-full bg-gray-100 text-gray-600">Unread</span>
                </td>
                <td class="px-6 py-4 text-sm">Jan 16, 2025</td>
                <td class="px-6 py-4">
                    <div class="flex gap-2">
                        <button onclick="openNotificationPopup('N002')" class="text-blue-600 hover:text-blue-800">👁️</button>
                        <button class="text-red-600 hover:text-red-800">🗑️</button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
