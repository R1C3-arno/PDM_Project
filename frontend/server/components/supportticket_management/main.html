<main>
    <!-- Header với Search & Actions -->
    <div class="bg-white rounded-lg shadow p-6 mb-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-bold text-gray-800">Support Tickets</h2>
            <button class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600">
                + New Ticket
            </button>
        </div>

        <div class="flex gap-4">
            <input type="text" placeholder="🔍 Search by Ticket ID or User ID..."
                   class="flex-1 px-4 py-2 border rounded-lg">
            <select class="px-4 py-2 border rounded-lg">
                <option>All Status</option>
                <option>Open</option>
                <option>In Progress</option>
                <option>Resolved</option>
                <option>Closed</option>
            </select>
            <select class="px-4 py-2 border rounded-lg">
                <option>All Priority</option>
                <option>Low</option>
                <option>Medium</option>
                <option>High</option>
                <option>Urgent</option>
            </select>
        </div>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="w-full">
            <thead class="bg-gray-50 border-b">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Ticket ID</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">User ID</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Subject</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Category</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Priority</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Status</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Assigned To</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Created</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Actions</th>
            </tr>
            </thead>
            <tbody class="divide-y">
            <tr class="hover:bg-gray-50">
                <td class="px-6 py-4 text-sm font-semibold">#T001</td>
                <td class="px-6 py-4 text-sm">U12345</td>
                <td class="px-6 py-4 text-sm">Cannot login to account</td>
                <td class="px-6 py-4 text-sm">Technical</td>
                <td class="px-6 py-4">
                    <span class="px-3 py-1 text-xs rounded-full bg-red-100 text-red-600">High</span>
                </td>
                <td class="px-6 py-4">
                    <span class="px-3 py-1 text-xs rounded-full bg-yellow-100 text-yellow-600">In Progress</span>
                </td>
                <td class="px-6 py-4 text-sm">Admin #2</td>
                <td class="px-6 py-4 text-sm">Jan 15, 2025</td>
                <td class="px-6 py-4">
                    <div class="flex gap-2">
                        <button onclick="openTicketPopup('T001')" class="text-blue-600 hover:text-blue-800" title="View">👁️</button>
                        <button onclick="openEditTicketPopup('T001')" class="text-yellow-600 hover:text-yellow-800" title="Edit">✏️</button>
                        <button class="text-red-600 hover:text-red-800" title="Delete">🗑️</button>
                    </div>
                </td>
            </tr>
            <tr class="hover:bg-gray-50">
                <td class="px-6 py-4 text-sm font-semibold">#T002</td>
                <td class="px-6 py-4 text-sm">U67890</td>
                <td class="px-6 py-4 text-sm">Payment issue</td>
                <td class="px-6 py-4 text-sm">Billing</td>
                <td class="px-6 py-4">
                    <span class="px-3 py-1 text-xs rounded-full bg-orange-100 text-orange-600">Medium</span>
                </td>
                <td class="px-6 py-4">
                    <span class="px-3 py-1 text-xs rounded-full bg-green-100 text-green-600">Resolved</span>
                </td>
                <td class="px-6 py-4 text-sm">Admin #1</td>
                <td class="px-6 py-4 text-sm">Jan 14, 2025</td>
                <td class="px-6 py-4">
                    <div class="flex gap-2">
                        <button onclick="openTicketPopup('T002')" class="text-blue-600 hover:text-blue-800">👁️</button>
                        <button onclick="openEditTicketPopup('T002')" class="text-yellow-600 hover:text-yellow-800">✏️</button>
                        <button class="text-red-600 hover:text-red-800">🗑️</button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
