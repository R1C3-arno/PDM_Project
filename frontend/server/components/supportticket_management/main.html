<main>
    <div class="bg-white rounded-lg shadow p-6 mb-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-bold text-gray-800">Support Tickets</h2>
            <button onclick="openNewTicketPopup()" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 flex items-center gap-2">
                <i class='bx bx-plus'></i> New Ticket
            </button>
        </div>

        <div class="flex gap-4">
            <input type="text" id="searchInput" placeholder="🔍 Search by Ticket ID or User ID..."
                   class="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
            <select id="filterStatus" class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                <option value="">All Status</option>
                <option value="Open">Open</option>
                <option value="In Progress">In Progress</option>
                <option value="Resolved">Resolved</option>
                <option value="Closed">Closed</option>
            </select>
            <select id="filterPriority" class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                <option value="">All Priority</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
                <option value="Urgent">Urgent</option>
            </select>
        </div>
    </div>

    <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="w-full">
            <thead class="bg-gray-50 border-b">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Ticket ID</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">User ID</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Subject</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Category</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Priority</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Status</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Assigned To</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Created</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Actions</th>
            </tr>
            </thead>
            <tbody class="divide-y"></tbody>
        </table>
    </div>
</main>
