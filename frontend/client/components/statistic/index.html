<div class="main__container">
    <div class="page-header">
        <h1>Statistics</h1>
        <p>Overview of your loan statistics</p>
    </div>

    <!-- Overview Cards -->
    <div class="grid-4">
        <div class="stat-card">
            <div class="stat-icon blue">
                <i class="ri-money-dollar-circle-fill"></i>
            </div>
            <div class="stat-label">Total Borrowed</div>
            <div class="stat-value" id="totalBorrowed">$0</div>
        </div>

        <div class="stat-card">
            <div class="stat-icon orange">
                <i class="ri-money-dollar-box-fill"></i>
            </div>
            <div class="stat-label">Outstanding Debt</div>
            <div class="stat-value" id="outstandingDebt">$0</div>
        </div>

        <div class="stat-card">
            <div class="stat-icon green">
                <i class="ri-percent-fill"></i>
            </div>
            <div class="stat-label">Total Interest Paid</div>
            <div class="stat-value" id="totalInterestPaid">$0</div>
        </div>

        <div class="stat-card">
            <div class="stat-icon purple">
                <i class="ri-calendar-check-fill"></i>
            </div>
            <div class="stat-label">Next Payment</div>
            <div class="stat-value" id="nextPaymentAmount">$0</div>
            <div class="stat-change neutral" id="nextPaymentDate">-</div>
        </div>
    </div>

    <!-- Charts Section -->
    <div class="grid-2">
        <!-- Payment Progress -->
        <div class="card">
            <div class="card-title">Payment Progress</div>
            <div id="progressList">
                <!-- Dynamically loaded -->
            </div>
        </div>

        <!-- Loan Breakdown -->
        <div class="card">
            <div class="card-title">Loan Breakdown</div>

            <div class="breakdown-list">
                <div class="breakdown-item">
                    <div class="breakdown-label">
                        <div class="breakdown-color" style="background: #667eea"></div>
                        <span>Principal Amount</span>
                    </div>
                    <div class="breakdown-value" id="breakdownPrincipal">$0</div>
                </div>

                <div class="breakdown-item">
                    <div class="breakdown-label">
                        <div class="breakdown-color" style="background: #f093fb"></div>
                        <span>Interest Accrued</span>
                    </div>
                    <div class="breakdown-value" id="breakdownInterest">$0</div>
                </div>

                <div class="breakdown-item">
                    <div class="breakdown-label">
                        <div class="breakdown-color" style="background: #4caf50"></div>
                        <span>Paid Amount</span>
                    </div>
                    <div class="breakdown-value" id="breakdownPaid">$0</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Payment Schedule -->
    <div class="card">
        <div class="card-title">Upcoming Payment Schedule</div>

        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>Loan</th>
                    <th>Due Date</th>
                    <th>Total Amount</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody id="paymentScheduleBody">
                <!-- Dynamically loaded -->
                </tbody>
            </table>
        </div>
    </div>
</div>
