<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loan Repayment Declaration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/frontend/client/css/loan_application/style.css" />
</head>
<body>
<div class="container">
    <div class="sidebar">
        <div class="sidebar-content">
            <div class="step-item">
                <div id="step1-icon" class="step-icon active">1</div>
                <div>
                    <div id="step1-text" class="step-text active">Repayment Details</div>
                </div>
            </div>
            <div class="step-divider"></div>

            <div class="step-item">
                <div id="step2-icon" class="step-icon inactive">2</div>
                <div>
                    <div id="step2-text" class="step-text inactive">Payer Information</div>
                </div>
            </div>
            <div class="step-divider"></div>

            <div class="step-item">
                <div id="step3-icon" class="step-icon inactive">3</div>
                <div>
                    <div id="step3-text" class="step-text inactive">Upload Proof</div>
                </div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="content-card">
            <!-- Step 1 -->
            <div id="step1-content">
                <div class="form-group">
                    <label class="form-label">Loan Type</label>
                    <div class="loan-types">
                        <button class="loan-type-btn"><div><i class="fas fa-user"></i></div><div>Personal Loan</div></button>
                        <button class="loan-type-btn"><div><i class="fas fa-home"></i></div><div>Home Loan</div></button>
                        <button class="loan-type-btn"><div><i class="fas fa-chart-line"></i></div><div>Business Loan</div></button>
                        <button class="loan-type-btn"><div><i class="fas fa-car"></i></div><div>Car Loan</div></button>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Repayment Method</label>
                        <select class="form-select">
                            <option>Bank Transfer</option>
                            <option>Mobile Banking</option>
                            <option>Cash Deposit</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Paid Amount</label>
                        <input type="text" placeholder="$" class="form-input" />
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Repayment Date</label>
                    <input type="date" class="form-input" />
                </div>

                <div class="nav-buttons">
                    <div></div>
                    <button onclick="goToStep(2)" class="btn btn-primary">Next <i class="fas fa-arrow-right"></i></button>
                </div>
            </div>

            <!-- Step 2 -->
            <div id="step2-content" class="hidden">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Full Name*</label>
                        <input type="text" class="form-input" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email*</label>
                        <input type="email" class="form-input" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Phone Number*</label>
                        <input type="tel" class="form-input" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Address*</label>
                        <input type="text" class="form-input" />
                    </div>
                </div>

                <div class="nav-buttons">
                    <button onclick="goToStep(1)" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Previous</button>
                    <button onclick="goToStep(3)" class="btn btn-primary">Next <i class="fas fa-arrow-right"></i></button>
                </div>
            </div>

            <!-- Step 3 -->
            <div id="step3-content" class="hidden">
                <div class="instructions">
                    <div class="instruction-item">
                        <span>1.</span>
                        <p>Upload proof of repayment — such as a bank transfer receipt, mobile banking screenshot, or bank statement showing the transaction.</p>
                    </div>
                </div>

                <div class="upload-area">
                    <div><i class="fas fa-file-upload"></i></div>
                    <h3>Drag and drop proof of payment</h3>
                    <p>or <a href="#">Browse</a> to choose a file</p>
                    <p style="font-size: 12px; margin-top: 0.5rem; color: var(--text-tertiary)">PNG, JPG, PDF</p>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" />
                    <label>I confirm the repayment information provided is accurate.</label>
                </div>

                <div class="nav-buttons">
                    <button onclick="goToStep(2)" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Previous</button>
                    <button class="btn btn-primary">Submit</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/frontend/client/js/components/repay_documentation.js"></script>
</body>
</html>
