<div class="main__container">
    <div class="page-header">
        <h1>Settings</h1>
        <p>Manage your account preferences</p>
    </div>

    <!-- Profile Settings -->
    <div class="card">
        <div class="card-title">Profile Information</div>

        <div class="profile-section">
            <div class="profile-avatar">
                <img id="avatarImage" src="/frontend/client/assets/images/perfil.png" alt="profile">
                <button class="avatar-edit" onclick="document.getElementById('avatarInput').click()">
                    <i class="ri-camera-fill"></i>
                </button>
                <input type="file" id="avatarInput" accept="image/*" style="display: none;">
            </div>

            <div class="profile-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="fullName" placeholder="Enter your name">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email" readonly>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="phone" placeholder="Enter phone number">
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" id="address" placeholder="Enter your address">
                    </div>
                </div>

                <button class="btn btn-primary" id="saveProfileBtn">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Security Settings -->
    <div class="card">
        <div class="card-title">Security</div>

        <div class="settings-list">
            <div class="settings-item">
                <div class="settings-info">
                    <h4>Change Password</h4>
                    <p>Update your password regularly for better security</p>
                </div>
                <button class="btn btn-outline" id="changePasswordBtn">Change</button>
            </div>
        </div>

        <!-- Change Password Modal (Hidden by default) -->
        <div id="passwordModal" style="display: none; margin-top: 20px; padding: 20px; background: #f5f5f5; border-radius: 8px;">
            <h4>Change Password</h4>
            <div class="form-group" style="margin-top: 15px;">
                <label>Current Password</label>
                <input type="password" id="oldPassword" placeholder="Enter current password">
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="Enter new password">
            </div>
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm new password">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn btn-primary" id="submitPasswordBtn">Update Password</button>
                <button class="btn btn-secondary" id="cancelPasswordBtn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Danger Zone -->
    <div class="card danger-card">
        <div class="card-title">Danger Zone</div>

        <div class="settings-list">
            <div class="settings-item">
                <div class="settings-info">
                    <h4>Delete Account</h4>
                    <p>Permanently delete your account and all data</p>
                </div>
                <button class="btn btn-danger" id="deleteAccountBtn">Delete Account</button>
            </div>
        </div>
    </div>
</div>
