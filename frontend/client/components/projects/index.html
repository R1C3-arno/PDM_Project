<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - PDM Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/frontend/client/js/components/projects.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .slider-container {
            transition: transform 0.5s ease-in-out;
        }
    </style>
</head>
<body>
<!-- Projects -->
<div class="container mx-auto py-4 pt-20 px-6 md:px-20 lg:px-32 w-full overflow-hidden" id="Projects">
    <h1 class="text-2xl sm:text-4xl font-bold mb-2 text-center">Projects <span class="underline underline-offset-4 decoration-1 under font-light">Completed</span></h1>
    <p class="text-center text-gray-500 mb-8 max-w-80 mx-auto">Crafting Spaces, Building Legacies—Explore Our Portfolio</p>

    <!-- Slider buttons -->
    <div class="flex justify-end items-center mb-8">
        <button id="prevBtn" class="p-3 bg-gray-200 rounded mr-2" aria-label="Previous Project">
            <img src="/frontend/client/assets/images/main/left_arrow.png" alt="Previous" class="w-6 h-6"/>
        </button>
        <button id="nextBtn" class="p-3 bg-gray-200 rounded mr-2" aria-label="Next Project">
            <img src="/frontend/client/assets/images/main/right_arrow.png" alt="Next" class="w-6 h-6"/>
        </button>
    </div>

    <!-- Project slider container -->
    <div class="overflow-hidden">
        <div id="projectSlider" class="flex gap-8 slider-container">
            <!-- Projects will be dynamically inserted here -->
        </div>
    </div>
</div>


</body>
</html>
