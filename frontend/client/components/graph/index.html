<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forecast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            font-family: "Inter", sans-serif;
        }

        :root {
            --body-color: #000000;
            --container-color: #1f1f1f;
            --hover-color: #2e2e2e;
            --title-color: #ffffff;
            --text-color: #a6a6a6;
            --text-tertiary: #969593;
            --first-color: #4aa584;
            --second-color: #e3ffa8;
            --border-color: #313131;
            --shadow-color: rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4" style="background: #000000;">
<div class="max-w-6xl w-full">
    <!-- Forecast Card -->
    <div class="rounded-3xl shadow-2xl p-8" style="background: #1f1f1f;">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-3xl font-bold" style="color: #ffffff;">FORECAST</h1>
            <button class="transition-colors" style="color: #a6a6a6;" onmouseover="this.style.color='#ffffff'" onmouseout="this.style.color='#a6a6a6'">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                </svg>
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left Column - Inputs -->
            <div class="space-y-6">
                <!-- Inflation Rate -->
                <div>
                    <label class="block text-sm font-medium mb-2" style="color: #a6a6a6;">Inflation Rate</label>
                    <div class="relative">
                        <input type="number" value="5" class="w-full px-4 py-3 rounded-lg focus:ring-2 focus:border-transparent pr-8" style="background: #000000; border: 2px solid #313131; color: #ffffff; outline: none;" onfocus="this.style.borderColor='#4aa584'" onblur="this.style.borderColor='#313131'">
                        <span class="absolute right-4 top-1/2 transform -translate-y-1/2 font-medium" style="color: #a6a6a6;">%</span>
                    </div>
                </div>

                <!-- Appreicate Rate -->
                <div>
                    <label class="block text-sm font-medium mb-2" style="color: #a6a6a6;">Appreicate Rate</label>
                    <div class="relative">
                        <input type="number" value="5" class="w-full px-4 py-3 rounded-lg focus:ring-2 focus:border-transparent pr-8" style="background: #000000; border: 2px solid #313131; color: #ffffff; outline: none;" onfocus="this.style.borderColor='#4aa584'" onblur="this.style.borderColor='#313131'">
                        <span class="absolute right-4 top-1/2 transform -translate-y-1/2 font-medium" style="color: #a6a6a6;">%</span>
                    </div>
                </div>

                <!-- Current Property Value -->
                <div class="pt-4">
                    <label class="block text-sm font-medium mb-2" style="color: #969593;">Current Property Value</label>
                    <div class="text-4xl font-bold" style="color: #ffffff;">$471,900</div>
                </div>

                <!-- Property Value Forecast -->
                <div class="pt-4">
                    <label class="block text-sm font-medium mb-2" style="color: #969593;">Property Value Forecast</label>
                    <div class="text-4xl font-bold" style="color: #4aa584;">$675,230</div>
                </div>
            </div>

            <!-- Right Column - Chart -->
            <div class="lg:col-span-2">
                <div class="h-96">
                    <canvas id="forecastChart"></canvas>
                </div>

                <!-- Legend -->
                <div class="flex items-center justify-center gap-8 mt-6">
                    <div class="flex items-center gap-2">
                        <div class="w-4 h-4 rounded" style="background: #667eea;"></div>
                        <span class="text-sm font-medium" style="color: #a6a6a6;">Principal Paid</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-4 h-4 rounded" style="background: #f093fb;"></div>
                        <span class="text-sm font-medium" style="color: #a6a6a6;">Interest Paid</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-0.5 h-4" style="background: #4aa584;"></div>
                        <span class="text-sm font-medium" style="color: #a6a6a6;">Rent</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/frontend/client/js/components/graph.js"></script>
</body>
</html>
