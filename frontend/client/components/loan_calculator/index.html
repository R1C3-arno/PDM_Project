<div class="main__container">
    <div class="page-header">
        <h1>Calculate and Confirm your Loans</h1>
    </div>

    <div class="calculator-wrapper">
        <div class="calculator-left">
            <h3 class="section-title">Loan Calculator</h3>

            <div class="input-group">
                <label class="input-label">Loan Amount</label>
                <div class="slider-container">
                    <input type="range" class="slider" id="loanAmount" min="1000" max="100000" value="50000">
                    <input type="text" class="input-value" id="loanAmountValue" value="$50,000" readonly>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Interest Rate (%)</label>
                <div class="slider-container">
                    <input type="range" class="slider" id="interestRate" min="1" max="20" value="10" step="0.1">
                    <input type="text" class="input-value" id="interestRateValue" value="10%" readonly>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Loan Duration (Months)</label>
                <div class="slider-container">
                    <input type="range" class="slider" id="loanTerm" min="1" max="360" value="60">
                    <input type="text" class="input-value" id="loanTermValue" value="60 Months" readonly>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Purpose</label>
                <input type="text" class="date-input" id="purpose" placeholder="Enter loan purpose">
            </div>
        </div>

        <div class="calculator-right">
            <div class="summary-list">
                <div class="summary-item">
                    <span class="summary-label">Loan Amount</span>
                    <span class="summary-value" id="displayLoanAmount">$50,000</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Monthly Payment</span>
                    <span class="summary-value" id="displayMonthlyPayment">$1,062</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Total Amount</span>
                    <span class="summary-value" id="displayTotalAmount">$63,720</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Interest Payable</span>
                    <span class="summary-value" id="displayInterest">$13,720</span>
                </div>
            </div>

            <div class="choice-button">
                <button class="btn-discard" onclick="resetCalculator()">Reset</button>
                <button class="btn-apply" onclick="applyLoan()">Apply Now</button>
            </div>
        </div>
    </div>
</div>

<script src="/frontend/client/js/components/loan_calculator.js"></script>
