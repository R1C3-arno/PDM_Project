<div class="cta-section">
    <div class="cta-card">
        <div class="cta-icon">💰</div>
        <h4>Need More Funds?</h4>
        <p>Apply for a new loan with competitive rates</p>
        <button class="btn-cta" data-action="request-loan">Request New Loan</button>
    </div>

    <div class="cta-card">
        <div class="cta-icon">💳</div>
        <h4>Top-up Your Wallet</h4>
        <p>Add funds instantly to your account</p>
        <button class="btn-cta" data-action="add-funds">Add Funds</button>
    </div>

    <div class="cta-card">
        <div class="cta-icon">📊</div>
        <h4>View Full History</h4>
        <p>Check all your transactions and loans</p>
        <button class="btn-cta" data-action="view-transactions">View Transactions</button>
    </div>
</div>
