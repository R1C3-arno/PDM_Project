<div class="dashboard-header">
    <div class="user-info">
        <img src="../../../assets/images/perfil.png" alt="Avatar" class="user-avatar" id="userAvatar">
        <div class="user-details">
            <h2 class="user-name" id="userName">Loading...</h2>
            <p class="user-role" id="userRole">Member</p>
        </div>
    </div>

    <div class="overview-stats">
        <div class="stat-item">
            <span class="stat-label">Wallet Balance</span>
            <span class="stat-value balance" id="walletBalance">$0.00</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Outstanding Loan</span>
            <span class="stat-value outstanding" id="outstandingLoan">$0.00</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Paid Loans</span>
            <span class="stat-value paid" id="paidLoans">$0.00</span>
        </div>
    </div>

    <div class="quick-actions">
        <button class="action-btn btn-primary" id="addFundsBtn">
            💰 Add Funds
        </button>
        <button class="action-btn btn-secondary" id="requestLoanBtn">
            📝 Request Loan
        </button>
        <button class="action-btn btn-success" id="repayLoanBtn">
            💳 Repay Loan
        </button>
    </div>
</div>
