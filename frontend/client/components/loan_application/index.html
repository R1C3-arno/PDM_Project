<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Application Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/client/css/loan_application/style.css">
</head>
<body>
<div class="container">
    <div class="sidebar">
        <div class="sidebar-content">
            <div class="step-item">
                <div id="step1-icon" class="step-icon active">1</div>
                <div>
                    <div id="step1-text" class="step-text active">Loan Details</div>
                </div>
            </div>
            <div class="step-divider"></div>

            <div class="step-item">
                <div id="step2-icon" class="step-icon inactive">2</div>
                <div>
                    <div id="step2-text" class="step-text inactive">Contact Info</div>
                </div>
            </div>
            <div class="step-divider"></div>

            <div class="step-item">
                <div id="step3-icon" class="step-icon inactive">3</div>
                <div>
                    <div id="step3-text" class="step-text inactive">Confirmation</div>
                </div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="content-card">
            <div id="step1-content">
                <div class="loan-types">
                    <button class="loan-type-btn">
                        <div><i class="fas fa-user"></i></div>
                        <div>Personal Loan</div>
                    </button>
                    <button class="loan-type-btn">
                        <div><i class="fas fa-home"></i></div>
                        <div>Home Loan</div>
                    </button>
                    <button class="loan-type-btn">
                        <div><i class="fas fa-chart-line"></i></div>
                        <div>Business Loan</div>
                    </button>
                    <button class="loan-type-btn">
                        <div><i class="fas fa-car"></i></div>
                        <div>Car Loan</div>
                    </button>
                </div>

                <div class="form-group">
                    <label class="form-label">Your loan amount</label>
                    <input type="text" id="loanAmountDisplay" placeholder="$" class="form-input" readonly>
                </div>

                <div class="form-group">
                    <label class="form-label">Loan duration</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="duration" value="12">
                            <span>12 months</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="duration" value="18">
                            <span>18 months</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="duration" value="24">
                            <span>24 months</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="duration" value="36">
                            <span>36 months</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="duration" value="48">
                            <span>48 months</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Purpose</label>
                    <textarea id="loanPurpose" class="form-input" rows="3" placeholder="Enter loan purpose"></textarea>
                </div>

                <div class="nav-buttons">
                    <div></div>
                    <button onclick="goToStep(2)" class="btn btn-primary">
                        Next <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>

            <div id="step2-content" class="hidden">
                <div class="form-group">
                    <label class="form-label">Phone Number*</label>
                    <input type="tel" id="phoneNumber" class="form-input" placeholder="Enter your phone number">
                </div>

                <div class="form-group">
                    <label class="form-label">Address</label>
                    <textarea id="address" class="form-input" rows="3" placeholder="Enter your address"></textarea>
                </div>

                <div class="nav-buttons">
                    <button onclick="goToStep(1)" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Previous
                    </button>
                    <button onclick="goToStep(3)" class="btn btn-primary">
                        Next <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>

            <div id="step3-content" class="hidden">
                <div class="instructions">
                    <div class="instruction-item">
                        <span>1.</span>
                        <p>Upload your ID Card or Passport (Front and Back)</p>
                    </div>
                    <div class="instruction-item">
                        <span>2.</span>
                        <p>Upload your Signature Document</p>
                    </div>
                </div>

                <div class="upload-area" onclick="document.getElementById('fileUpload').click()">
                    <div>
                        <i class="fas fa-file-upload"></i>
                    </div>
                    <h3>Drag and drop files here</h3>
                    <p>or <a href="#">Browse</a> to choose files</p>
                    <p style="font-size: 12px; margin-top: 0.5rem; color: var(--text-tertiary);">PNG, JPG, PDF, DOCX</p>
                    <input type="file" id="fileUpload" multiple accept=".png,.jpg,.jpeg,.pdf,.docx" style="display: none;">
                </div>

                <div id="fileList" style="margin-top: 1rem;"></div>

                <div class="checkbox-group">
                    <input type="checkbox" id="agreeTerms">
                    <label>I hereby agree that the information given is true, accurate and complete.</label>
                </div>

                <div class="nav-buttons">
                    <button onclick="goToStep(2)" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Previous
                    </button>
                    <button onclick="submitLoanApplication()" class="btn btn-primary">
                        Submit Application
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/frontend/client/js/components/loan_application.js"></script>
</body>
</html>
