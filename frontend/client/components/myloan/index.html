<div class="main__container">
    <div class="page-header">
        <h1>My Loans</h1>
        <p>View and manage your loan applications</p>
    </div>

    <!-- Loan Summary -->
    <div class="grid-3">
        <div class="stat-card">
            <div class="stat-icon blue">
                <i class="ri-file-list-3-fill"></i>
            </div>
            <div class="stat-label">Active Loans</div>
            <div class="stat-value" id="activeLoansCount">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-icon orange">
                <i class="ri-time-fill"></i>
            </div>
            <div class="stat-label">Pending Approval</div>
            <div class="stat-value" id="pendingLoansCount">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-icon green">
                <i class="ri-checkbox-circle-fill"></i>
            </div>
            <div class="stat-label">Completed Loans</div>
            <div class="stat-value" id="completedLoansCount">0</div>
        </div>
    </div>

    <!-- Loans List -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">My Loans</div>
            <button class="btn btn-primary" onclick="window.location.href='/frontend/client/pages/User_loan_application/index.html'">
                <i class="ri-add-line"></i>
                New Loan
            </button>
        </div>

        <div class="loan-list" id="loansList">
            <!-- Dynamically loaded -->
        </div>
    </div>
</div>
