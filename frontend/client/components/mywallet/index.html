<div class="main__container">
    <div class="page-header">
        <h1>My Wallet</h1>
        <p>Manage your balance and transactions</p>
    </div>

    <!-- Balance Card -->
    <div class="balance-card">
        <div class="balance-label">Total Balance</div>
        <div class="balance-amount" id="totalBalance">$0.00</div>
        <div class="balance-actions">
            <button class="btn btn-white">
                <i class="ri-add-line"></i>
                Deposit
            </button>
            <button class="btn btn-white">
                <i class="ri-arrow-right-line"></i>
                Withdraw
            </button>
        </div>
    </div>

    <!-- Statistics -->
    <div class="grid-3">
        <div class="stat-card">
            <div class="stat-icon blue">
                <i class="ri-wallet-3-fill"></i>
            </div>
            <div class="stat-label">Available Credit</div>
            <div class="stat-value" id="availableCredit">$0.00</div>
        </div>

        <div class="stat-card">
            <div class="stat-icon green">
                <i class="ri-arrow-down-line"></i>
            </div>
            <div class="stat-label">Total Borrowed</div>
            <div class="stat-value" id="totalBorrowed">$0.00</div>
        </div>

        <div class="stat-card">
            <div class="stat-icon orange">
                <i class="ri-arrow-up-line"></i>
            </div>
            <div class="stat-label">Total Repaid</div>
            <div class="stat-value" id="totalRepaid">$0.00</div>
        </div>
    </div>

    <!-- Recent Transactions -->
    <div class="card">
        <div class="card-title">Recent Transactions</div>
        <div id="transactionsList">
            <!-- Dynamically loaded -->
        </div>
    </div>
</div>
